<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D PRINTING / KAT.CRAFT</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk&family=Space+Mono&display=swap');
*{box-sizing:border-box}body{margin:0;background-color:#0B1D35;background-image:linear-gradient(#91b6da20 1px,transparent 1px),linear-gradient(90deg,#91b6da20 1px,transparent 1px),linear-gradient(#91b6da09 1px,transparent 1px),linear-gradient(90deg,#91b6da09 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#E4F1FF;font-family:'Space Grotesk',sans-serif}header,footer{padding:22px 6%;border-bottom:1px solid #91b6da40;background:#0B1D35;display:flex;justify-content:space-between;align-items:center}a{color:inherit;text-decoration:none}h1,h2,.brand{font-family:Anton,sans-serif;font-weight:400;margin:0}.brand{font-size:26px}.label,button{font:11px 'Space Mono',monospace;color:#91B6DA}.heading{padding:35px 6% 0}h1{font-size:clamp(42px,7vw,95px)}main{display:grid;grid-template-columns:34% 66%;align-items:center;min-height:600px}.selector{height:600px;position:relative;overflow:hidden;touch-action:none;user-select:none;cursor:grab}.ring{position:absolute;border:1px solid #91b6da55;border-radius:50%;pointer-events:none}.ring:after{content:'';position:absolute;inset:15px;border:1px dashed #91b6da40;border-radius:50%}.item{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid #91b6da55;background:#142D4C;padding:0;overflow:hidden;transition:left .22s,top .22s,transform .22s,opacity .22s}.dragging .item{transition:none}.item.active{border:2px solid #91B6DA;box-shadow:0 0 25px #91b6da40;z-index:2}.item model-viewer{width:100%;height:100%;pointer-events:none;--poster-color:transparent}.item span{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:9px;pointer-events:none}.nav{position:absolute;bottom:15px;left:15px;display:flex;gap:8px;align-items:center}.panel{border-left:1px solid #91b6da40;padding:20px 6%;min-width:0}#viewer{width:100%;height:450px;--poster-color:transparent}h2{font-size:clamp(25px,4vw,55px)}button{background:#0B1D35;border:1px solid #91b6da55;padding:10px;cursor:pointer}button:hover{border-color:#E4F1FF;color:#E4F1FF}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}input{width:100%;accent-color:#91B6DA}[hidden]{display:none!important}footer{margin-top:25px;border-top:1px solid #91b6da40}#status{min-height:16px}@media(max-width:700px){main{grid-template-columns:36% 64%;min-height:400px}.selector{height:400px}.item{width:66px;height:66px}.panel{padding:10px}#viewer{height:270px}.nav{left:4px;gap:3px;flex-wrap:wrap}.nav button{padding:6px}.label,button{font-size:9px}}
</style></head><body><header><a class="brand" href="../index.html">KAT.CRAFT</a><a class="label" href="../index.html#archive">← BACK TO ARCHIVE</a></header><section class="heading"><div class="label">SEC. 001 / OBJECT ARCHIVE</div><h1>3D PRINTING.</h1></section><main><div class="selector" id="selector"><div class="ring" id="ring"></div><div id="items"></div><div class="nav"><button id="prev" aria-label="Previous">↑</button><button id="next" aria-label="Next">↓</button><span class="label" id="counter"></span></div></div><section class="panel"><div class="label" id="number"></div><model-viewer id="viewer" camera-controls touch-action="none" interaction-prompt="none" environment-image="neutral" shadow-intensity="0.5" alt="Selected 3D object"></model-viewer><div class="label" id="status" role="status"></div><h2 id="name"></h2><p id="description"></p><div class="controls"><button id="rotate">AUTO ROTATE</button><button id="reset">RESET VIEW</button><button id="play" hidden>PLAY ANIMATION</button></div><div id="explode" hidden><label class="label" for="slider">ANIMATION POSITION / <span id="percent">0%</span></label><input id="slider" type="range" min="0" max="100" value="0"></div></section></main><footer class="label">KAT.CRAFT / KLASSICKO © 2026</footer><script>
// PROJECT DATABASE: animationType: auto, explode, play, none
const projects=[
{name:'OBJECT 001',file:'model01.glb',description:'Original 3D object.',animationType:'auto'},
{name:'OBJECT 002',file:'model02.glb',description:'Original 3D object.',animationType:'auto'},
{name:'OBJECT 003',file:'model03.glb',description:'Original 3D object.',animationType:'auto'},
{name:'OBJECT 004',file:'model04.glb',description:'Original 3D object.',animationType:'auto'}];
const $=id=>document.getElementById(id),v=$('viewer'),s=$('selector'),path='../models/3d-printing/';let selected=0,offset=0,start=null,hit=null,animation=null,playing=false,scrollTime=0;const wrap=i=>(i%projects.length+projects.length)%projects.length;
const items=projects.map((p,i)=>{const b=document.createElement('button');b.className='item';b.dataset.index=i;b.setAttribute('aria-label',p.name);const m=document.createElement('model-viewer');m.setAttribute('alt',p.name);m.setAttribute('interaction-prompt','none');m.setAttribute('loading','eager');const label=document.createElement('span');label.textContent=String(i+1).padStart(2,'0');b.append(m,label);$('items').append(b);b.addEventListener('click',e=>{if(e.detail===0)select(i)});return b});
function draw(){const mobile=innerWidth<=700,r=mobile?145:230,cx=mobile?-75:-35,cy=s.clientHeight/2;Object.assign($('ring').style,{width:2*r+'px',height:2*r+'px',left:cx-r+'px',top:cy-r+'px'});items.forEach((b,i)=>{let d=i-selected;if(d>projects.length/2)d-=projects.length;if(d< -projects.length/2)d+=projects.length;const a=d*1.05+offset,visible=Math.abs(a)<1.65;b.style.visibility=visible?'visible':'hidden';b.tabIndex=visible?0:-1;b.style.left=cx+r*Math.cos(a)+'px';b.style.top=cy+r*Math.sin(a)+'px';b.style.transform=`translate(-50%,-50%) scale(${Math.max(.55,1.25-Math.abs(a)*.48)})`;b.style.opacity=Math.max(.3,1-Math.abs(a)*.35);b.classList.toggle('active',i===selected);b.setAttribute('aria-pressed',i===selected);const m=b.firstChild;if(visible&&!m.hasAttribute('src'))m.setAttribute('src',path+projects[i].file)})}
function stop(){v.pause();playing=false;$('play').textContent='PLAY ANIMATION'}
function select(i){selected=wrap(i);offset=0;const p=projects[selected];stop();animation=null;$('play').hidden=$('explode').hidden=true;$('slider').value=0;$('percent').textContent='0%';v.removeAttribute('auto-rotate');$('rotate').textContent='AUTO ROTATE';v.cameraOrbit='0deg 75deg auto';v.cameraTarget='auto auto auto';v.fieldOfView='auto';$('name').textContent=p.name;$('description').textContent=p.description;$('number').textContent='SELECTED OBJECT / '+String(selected+1).padStart(3,'0');$('counter').textContent=`${selected+1} / ${projects.length}`;if(v.getAttribute('src')!==path+p.file){$('status').textContent='LOADING OBJECT...';v.setAttribute('src',path+p.file)}else if(v.loaded){loaded()}draw()}
function loaded(){ $('status').textContent='';stop();const p=projects[selected],a=v.availableAnimations||[];animation=a.find(n=>n.toLowerCase()==='default')||a[0];if(!animation||p.animationType==='none')return;v.animationName=animation;v.currentTime=0;$('play').hidden=p.animationType==='explode';$('explode').hidden=p.animationType==='play';}
v.addEventListener('load',loaded);v.addEventListener('error',()=>{$('status').textContent='MODEL COULD NOT BE LOADED'});
s.addEventListener('pointerdown',e=>{if(e.target.closest('.nav'))return;start=e.clientY;hit=e.target.closest('.item')?.dataset.index;s.setPointerCapture(e.pointerId);s.classList.add('dragging')});s.addEventListener('pointermove',e=>{if(start===null)return;offset=Math.max(-1.1,Math.min(1.1,(e.clientY-start)/130));draw()});s.addEventListener('pointerup',e=>{if(start===null)return;const d=e.clientY-start;s.classList.remove('dragging');if(Math.abs(d)<8&&hit!=null)select(Number(hit));else if(Math.abs(d)>45)select(selected-Math.sign(d));else{offset=0;draw()}start=null});s.addEventListener('pointercancel',()=>{start=null;offset=0;s.classList.remove('dragging');draw()});s.addEventListener('wheel',e=>{e.preventDefault();if(Date.now()-scrollTime<250)return;scrollTime=Date.now();select(selected+Math.sign(e.deltaY))},{passive:false});$('prev').onclick=()=>select(selected-1);$('next').onclick=()=>select(selected+1);
$('play').onclick=()=>{if(!animation)return;if(playing)stop();else{v.play();playing=true;$('play').textContent='PAUSE ANIMATION'}};$('slider').oninput=()=>{if(!animation)return;stop();v.currentTime=v.duration*Number($('slider').value)/100;$('percent').textContent=$('slider').value+'%'};v.addEventListener('timeupdate',()=>{if(playing&&v.duration){const n=Math.round(v.currentTime/v.duration*100);$('slider').value=n;$('percent').textContent=n+'%'}});$('rotate').onclick=()=>{$('rotate').textContent=v.toggleAttribute('auto-rotate')?'STOP ROTATION':'AUTO ROTATE'};$('reset').onclick=()=>{stop();v.removeAttribute('auto-rotate');$('rotate').textContent='AUTO ROTATE';v.cameraOrbit='0deg 75deg auto';v.cameraTarget='auto auto auto';v.fieldOfView='auto';if(animation)v.currentTime=0;$('slider').value=0;$('percent').textContent='0%';v.resetTurntableRotation();v.jumpCameraToGoal()};window.addEventListener('resize',draw);customElements.whenDefined('model-viewer').then(()=>select(0));
</script></body></html>
