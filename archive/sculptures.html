<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SCULPTURES / KAT.CRAFT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap');
:root{--bg:#0B1D35;--panel:#142D4C;--grid:#29496B;--accent:#91B6DA;--text:#E4F1FF;--border:#91B6DA40}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:'Space Grotesk',sans-serif;background-color:var(--bg);background-image:linear-gradient(#91B6DA20 1px,transparent 1px),linear-gradient(90deg,#91B6DA20 1px,transparent 1px),linear-gradient(#91B6DA08 1px,transparent 1px),linear-gradient(90deg,#91B6DA08 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px}a{color:inherit;text-decoration:none}header,footer{padding:22px 6%;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg)}footer{border-top:1px solid var(--border);border-bottom:0;margin-top:30px}.logo,h1,h2{font-family:Anton,sans-serif;font-weight:400}.logo{font-size:26px}.label,.back{font:11px 'Space Mono',monospace;color:var(--accent)}.heading{padding:35px 6% 10px}h1{font-size:clamp(44px,7vw,90px);margin:8px 0}main{display:grid;grid-template-columns:minmax(160px,32%) minmax(0,1fr);align-items:center}.wheel{height:540px;position:relative;overflow:hidden;touch-action:pan-x;user-select:none}.ring{position:absolute;border:1px solid var(--border);border-radius:50%;width:440px;height:440px;left:-250px;top:50%;transform:translateY(-50%)}.ring:after{content:'';position:absolute;inset:16px;border:1px dashed var(--border);border-radius:50%}.bubble{position:absolute;width:115px;height:115px;border:1px solid var(--border);border-radius:50%;padding:0;overflow:hidden;background:var(--panel);transition:top .25s,left .25s,transform .25s,opacity .25s;cursor:pointer}.bubble img{width:100%;height:100%;object-fit:cover;pointer-events:none}.bubble.active{border:2px solid var(--accent);box-shadow:0 0 24px #91B6DA35;z-index:2}.wheel-label{position:absolute;bottom:12px;left:20px}.panel{border-left:1px solid var(--border);padding:20px 6%;min-width:0}.stage{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;margin:12px 0}.media{height:clamp(280px,58vh,650px);display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;touch-action:pan-y}.media img,.media video{display:block;width:100%;height:100%;object-fit:contain;animation:fade .22s ease}.media img{cursor:zoom-in}@keyframes fade{from{opacity:.35}to{opacity:1}}button{color:var(--accent);background:transparent;border:1px solid var(--border);cursor:pointer;font:12px 'Space Mono',monospace}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.arrow{font-size:32px;border:0;padding:8px 0}.arrow:hover{color:white}.dots{display:flex;align-items:center;justify-content:center;gap:10px}.dot{width:9px;height:9px;padding:0;border-radius:50%;background:var(--grid)}.dot.active{background:var(--text)}h2{font-size:clamp(32px,5vw,60px);margin:16px 0 4px}.series{color:var(--accent);letter-spacing:.1em}.rights{margin-top:18px}dialog{background:var(--bg);color:var(--text);border:1px solid var(--accent);width:96vw;height:94vh;max-width:none;max-height:none;padding:12px;margin:auto}dialog::backdrop{background:#050d19e8}dialog img{width:100%;height:calc(100% - 40px);object-fit:contain}#close{display:block;margin-left:auto;padding:8px 12px}.error{color:var(--accent);text-align:center;font-size:13px}@media(max-width:700px){header{padding:16px 5%}.heading{padding:24px 5% 0}main{grid-template-columns:27% 73%}.wheel{height:380px}.ring{width:240px;height:240px;left:-205px}.bubble{width:56px;height:56px}.wheel-label{left:5px;font-size:8px}.panel{padding:12px 3%}.stage{grid-template-columns:21px minmax(0,1fr) 21px;gap:2px}.arrow{font-size:25px}.media{height:clamp(230px,48vh,420px)}.back{font-size:9px}.label{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><a class="logo" href="../index.html">KAT.CRAFT</a><a class="back" href="../index.html#archive">← BACK TO ARCHIVE</a></header>
<section class="heading"><div class="label">SEC. 002 / DIGITAL SCULPTING</div><h1>SCULPTURES.</h1></section>
<main><aside class="wheel" id="wheel" aria-label="Project selector"><div class="ring"></div><div id="bubbles"></div><div class="label wheel-label" id="wheelLabel"></div></aside>
<section class="panel"><div class="label" id="projectNumber"></div><div class="stage"><button class="arrow" id="prev" aria-label="Previous media">‹</button><div class="media" id="media"></div><button class="arrow" id="next" aria-label="Next media">›</button></div><div class="dots" id="dots"></div><h2 id="name"></h2><div class="label series" id="series"></div><p id="description"></p><div class="label rights">DIGITAL SCULPTURE / KLASSICKO<br>© KAT.CRAFT / ALL RIGHTS RESERVED</div></section></main>
<footer><span class="label">KAT.CRAFT / KLASSICKO © 2026</span></footer>
<dialog id="lightbox"><button id="close" aria-label="Close enlarged image">CLOSE ×</button><img id="large" alt="Enlarged artwork"></dialog>
<script>
/* PROJECT DATABASE — add another project here */
const projects=[{name:'LEE-OPARD',series:'ZOO CULTURE',description:'Digital sculpture from the ZOO Culture series.',folder:'../media/Sculptures/project01/',cover:'cover.PNG',media:['cover.PNG','image01.PNG','image02.PNG','animation01.mp4']}];
const $=id=>document.getElementById(id);let project=0,photo=0;const wrap=(n,len)=>(n%len+len)%len;const pad=n=>String(n).padStart(2,'0');
function renderWheel(){const root=$('bubbles');root.replaceChildren();const small=innerWidth<=700;const radius=small?120:220,center=small?-85:-30;projects.forEach((p,i)=>{let offset=i-project;if(offset>projects.length/2)offset-=projects.length;if(offset< -projects.length/2)offset+=projects.length;if(Math.abs(offset)>1)return;const angle=offset*1.05;const b=document.createElement('button');b.className='bubble'+(i===project?' active':'');b.style.left=(center+radius*Math.cos(angle))+'px';b.style.top=($('wheel').clientHeight/2+radius*Math.sin(angle))+'px';b.style.transform=`translate(-50%,-50%) scale(${i===project?1.25:.8})`;b.setAttribute('aria-label',p.name);b.setAttribute('aria-pressed',String(i===project));const img=new Image();img.src=p.folder+p.cover;img.alt=p.name;b.append(img);b.onclick=()=>select(i);root.append(b)});$('wheelLabel').textContent=`PROJECT ${pad(project+1)} / ${pad(projects.length)}`}
function renderMedia(){const p=projects[project],file=p.media[photo],url=p.folder+file;const root=$('media');root.replaceChildren();const video=/\.(mp4|webm)$/i.test(file);let el;if(video){el=document.createElement('video');el.muted=true;el.defaultMuted=true;el.loop=true;el.autoplay=true;el.playsInline=true;el.controls=true;el.setAttribute('aria-label',p.name+' animation')}else{el=new Image();el.alt=p.name+' — view '+(photo+1);el.onclick=()=>{$('large').src=url;$('lightbox').showModal()}}el.onerror=()=>{if(root.contains(el)){root.replaceChildren();const msg=document.createElement('p');msg.className='error';msg.textContent='MEDIA COULD NOT BE LOADED: '+file;root.append(msg)}};el.src=url;root.append(el);if(video)el.play().catch(()=>{});const dots=$('dots');dots.replaceChildren();p.media.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===photo?' active':'');b.setAttribute('aria-label','Media '+(i+1));b.setAttribute('aria-pressed',String(i===photo));b.onclick=()=>{photo=i;renderMedia()};dots.append(b)});const label=document.createElement('span');label.className='label';label.textContent=pad(photo+1)+' / '+pad(p.media.length);dots.append(label);$('prev').disabled=$('next').disabled=p.media.length<2}
function select(i){project=wrap(i,projects.length);photo=0;const p=projects[project];$('projectNumber').textContent='PROJECT / '+String(project+1).padStart(3,'0');$('name').textContent=p.name+'.';$('series').textContent='SERIES / '+p.series;$('description').textContent=p.description;renderWheel();renderMedia()}
function step(d){photo=wrap(photo+d,projects[project].media.length);renderMedia()}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=()=>$('lightbox').close();document.addEventListener('keydown',e=>{if($('lightbox').open||['VIDEO','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='ArrowUp'&&projects.length>1)select(project-1);if(e.key==='ArrowDown'&&projects.length>1)select(project+1)});
let start=null;$('media').addEventListener('touchstart',e=>{start=e.touches[0].clientX},{passive:true});$('media').addEventListener('touchend',e=>{if(start!==null){const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>50)step(d<0?1:-1);start=null}},{passive:true});let wy=null;$('wheel').addEventListener('pointerdown',e=>{wy=e.clientY});$('wheel').addEventListener('pointerup',e=>{if(wy!==null&&Math.abs(e.clientY-wy)>35&&projects.length>1)select(project+(e.clientY<wy?1:-1));wy=null});let last=0;$('wheel').addEventListener('wheel',e=>{if(projects.length<2)return;e.preventDefault();if(Date.now()-last>250){last=Date.now();select(project+(e.deltaY>0?1:-1))}},{passive:false});window.addEventListener('resize',renderWheel);select(0);
</script></body></html>
